name: Release extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          VSIX="${NAME}-${VERSION}.vsix"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.meta.outputs.version }}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be stable semantic versions such as v0.2.2: $TAG"
            exit 1
          fi

          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag/package.json version mismatch: tag=$TAG package.json=$VERSION"
            exit 1
          fi

      - name: Package VSIX
        run: npx --yes @vscode/vsce@3.9.2 package -o "${{ steps.meta.outputs.vsix }}"

      - name: Inspect packaged files
        run: npx --yes @vscode/vsce@3.9.2 ls

      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'push'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          npx --yes @vscode/vsce@3.9.2 publish
          --packagePath "${{ steps.meta.outputs.vsix }}"
          --skip-duplicate

      - name: Publish to Open VSX
        if: github.event_name == 'push'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: >-
          npx --yes ovsx@1.1.1 publish
          "${{ steps.meta.outputs.vsix }}"
          --skip-duplicate

      - name: Create GitHub Release and attach VSIX
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.meta.outputs.vsix }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.meta.outputs.vsix }}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Dry run completed."
          echo "VSIX: ${{ steps.meta.outputs.vsix }}"
          echo "No marketplace publication or GitHub Release was performed."
