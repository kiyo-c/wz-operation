name: Release extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate only (no publish)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME:-}"
          VSIX="${NAME}-${VERSION}.vsix"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        if: github.event_name == 'push'
        shell: bash
        run: |
          EXPECTED="v${{ steps.meta.outputs.version }}"
          ACTUAL="${{ steps.meta.outputs.tag }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Tag/package.json version mismatch: tag=$ACTUAL package.json=${{ steps.meta.outputs.version }}"
            exit 1
          fi

      - name: Package VSIX
        run: npx --yes @vscode/vsce@3.9.2 package -o "${{ steps.meta.outputs.vsix }}"

      - name: Inspect packaged files
        run: npx --yes @vscode/vsce@3.9.2 ls

      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'push' && !endsWith(github.ref_name, '-pre')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath "${{ steps.meta.outputs.vsix }}"

      - name: Publish to Open VSX
        if: github.event_name == 'push' && !endsWith(github.ref_name, '-pre')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish "${{ steps.meta.outputs.vsix }}"

      - name: Create GitHub Release and attach VSIX
        if: github.event_name == 'push' && !endsWith(github.ref_name, '-pre')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.vsix }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            --verify-tag
